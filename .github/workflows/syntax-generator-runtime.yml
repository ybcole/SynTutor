name: Syntax Generator parser-backed runtime checks

on:
  push:
    branches:
      - milestone-02-syntax-generator
  pull_request:
    branches:
      - main
      - feature/milestone-07-*
      - feature/milestone-08-*
      - feature/milestone-10-*
  workflow_dispatch:

jobs:
  parser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install SynTutor parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; open('/tmp/syntutor-cpu-constraint.txt', 'w').write('torch==' + torch.__version__ + '\\n')"
          python -m pip install -r requirements.txt -c /tmp/syntutor-cpu-constraint.txt
      - name: Install pinned parser models from GitHub release assets
        run: |
          set -euo pipefail
          download_dir=$(mktemp -d)
          cd "$download_dir"
          fetch() {
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --max-time 180 -H 'Accept: application/octet-stream' \
              "https://api.github.com/repos/$1/releases/assets/$2?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$3"
          }
          fetch explosion/spacy-models 195734413 en_core_web_md-3.8.0-py3-none-any.whl
          fetch nikitakit/self-attentive-parser 31667636 benepar_en3.zip
          sha256sum -c <<'HASHES'
          5e6329fe3fecedb1d1a02c3ea2172ee0fede6cea6e4aefb6a02d832dba78a310  en_core_web_md-3.8.0-py3-none-any.whl
          de97297ec17b92f7a40ef2e23fd1b4b8baed02eb8bee3d09b25ac6166ae17996  benepar_en3.zip
          HASHES
          python -m pip install --no-deps en_core_web_md-3.8.0-py3-none-any.whl
          mkdir -p "$HOME/nltk_data/models"
          unzip -q benepar_en3.zip -d "$HOME/nltk_data/models"
      - name: Verify parser model availability
        run: |
          python - <<'PY'
          import spacy
          import benepar
          nlp = spacy.load("en_core_web_md")
          nlp.add_pipe("benepar", config={"model": "benepar_en3"})
          doc = nlp("The students laugh.")
          sentences = list(doc.sents)
          assert sentences, "spaCy did not detect a sentence"
          assert sentences[0]._.parse_string
          print("spaCy and Benepar models loaded and parsed a sentence.")
          PY
      - name: Run parser-backed Syntax Generator tests
        working-directory: server
        run: python -m unittest -v test_parser_runtime
      - name: Run existing LF/CRLF multiline parser regression
        run: python server/test_multiline_parse.py
      - name: Audit FINAL-D1 sentence coverage
        run: python scripts/audit_final_d1_sentence_coverage.py --output artifacts/final-d1-coverage.json
      - name: Upload FINAL-D1 coverage report
        uses: actions/upload-artifact@v4
        with:
          name: final-d1-sentence-coverage
          path: artifacts/final-d1-coverage.json

      - name: Install browser smoke-test runtime
        run: |
          python -m pip install 'playwright>=1.51,<2'
          python -m playwright install --with-deps chromium
      - name: Verify Generator and Builder evidence in a browser
        run: |
          python scripts/test_explanation_browser.py
          python scripts/test_explanation_browser.py --reviewed-fixture
          python scripts/test_explanation_browser.py --final-declarative
          python scripts/test_explanation_browser.py --working-tree
          python scripts/test_explanation_browser.py --missing-label-master
          python scripts/test_lessons_browser.py
          python scripts/test_quizzes_browser.py
          python scripts/test_generator_canvas_browser.py
          python scripts/test_builder_browser.py
