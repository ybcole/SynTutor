name: Syntax Generator model-free checks

on:
  push:
    branches:
      - milestone-02-syntax-generator
  pull_request:
    branches:
      - main
      - feature/milestone-07-*
      - feature/milestone-08-*
      - feature/milestone-10-*
  workflow_dispatch:

jobs:
  syntax-generator-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: syntutor_progression_test
          POSTGRES_PASSWORD: syntutor-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syntutor_progression_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install -r requirements-test.txt
      - name: Validate CGEL Phase A schema and honest ledger baseline
        run: |
          python tools/migrate_diagnostics.py --check
          python tools/validate_cgel_rules.py
          python tools/ledger.py check --allow-unprocessed
          python -m unittest -v tools.test_cgel_infrastructure
          python -m unittest -v tools.test_cgel_phase_b
          python -m unittest -v tools.test_cgel_phase_b_91_114
          python -m unittest -v tools.test_cgel_phase_b_115_122
          python -m unittest -v tools.test_cgel_phase_b_139_146
          python -m unittest -v tools.test_cgel_phase_b_147_154

      - name: Verify progression with concurrent PostgreSQL sessions
        env:
          SYNTUTOR_PROGRESSION_TEST_DSN: postgresql://postgres:syntutor-test@localhost:5432/syntutor_progression_test
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          python scripts/test_progression_database.py
          python scripts/test_achievements_database.py
          python scripts/test_leaderboard_database.py
          python scripts/test_account_integration_database.py
      - name: Compile backend modules and tests
        run: python -m compileall -q server
      - name: Run isolated Syntax Generator tests
        working-directory: server
        run: python -m unittest -v test_br_tree test_cambridge_registry test_cambridge_evaluator test_grammar_schema test_br_tree_fixtures test_br_tree_schema test_api_contract test_webapp_contract test_stdlib_transport_contract test_detector test_explanations test_explanation_transports test_br_source_extensions test_source_readiness test_quiz_evidence test_builder_evaluation

      - name: Validate XAI-PRE source and multi-error correction contracts
        run: |
          python -m json.tool grammar/xai_pre/source_audit.json > /dev/null
          python -m json.tool grammar/xai_pre/preflight_fixtures.json > /dev/null
          python -m json.tool docs/xai/diagnosis-repair-pre.schema.json > /dev/null
          python -m unittest -v server.test_xai_preflight
          python scripts/audit_xai_pre.py --require-contracts > /tmp/xai-pre-report.json
          python -m json.tool /tmp/xai-pre-report.json > /dev/null

      - name: Validate XAI-0 development corpus and measurement semantics
        run: |
          python scripts/audit_xai0_baseline.py --validate-input-only --expected-count 116
          python -m unittest -v server.test_xai0_baseline

      - name: Validate XAI-1 source-checked English concept registry
        run: |
          python -m json.tool grammar/xai_concepts/catalog.json > /dev/null
          python -m json.tool grammar/xai_concepts/catalog.schema.json > /dev/null
          python -m unittest -v server.test_xai_concepts
          python scripts/audit_xai1_concepts.py --require-valid --output /tmp/xai1-source-coverage.json
          python -m json.tool /tmp/xai1-source-coverage.json > /dev/null

      - name: Validate XAI-2 sentence fact graphs and source-safe roles
        working-directory: server
        run: |
          python -m unittest -v test_xai_facts
          python -m json.tool ../grammar/xai_facts.schema.json > /dev/null

      - name: Validate XAI-3 contextual explanation composer and proof coverage
        working-directory: server
        run: |
          python -m json.tool ../grammar/xai_composer.schema.json > /dev/null
          python -m unittest -v test_xai_composer

      - name: Validate XAI-4 source-gated Cambridge partial checks
        working-directory: server
        run: |
          python -m json.tool ../grammar/xai4_candidates.json > /dev/null
          python -m json.tool ../grammar/xai4_candidates.schema.json > /dev/null
          python -m json.tool ../grammar/xai4_partial.schema.json > /dev/null
          python -m unittest -v test_xai4_partial

      - name: Validate XAI-5 tree localization and independent revision lineage
        working-directory: server
        run: |
          python -m json.tool ../grammar/xai5_localization.schema.json > /dev/null
          python -m json.tool ../grammar/xai5_repair.schema.json > /dev/null
          python -m unittest -v test_xai5_repair

      - name: Validate XAI-6 constrained naturalization policy and adversarial fallback
        working-directory: server
        run: |
          python -m json.tool ../grammar/xai6_policy.json > /dev/null
          python -m json.tool ../grammar/xai6_policy.schema.json > /dev/null
          python -m json.tool ../grammar/xai6_candidate.schema.json > /dev/null
          python -m json.tool ../grammar/xai6_result.schema.json > /dev/null
          python -m unittest -v test_xai6_naturalizer
          cd ..
          python scripts/audit_xai6_naturalization.py > /tmp/xai6-source-audit.json
          python -m json.tool /tmp/xai6-source-audit.json > /dev/null

      - name: Validate XAI-7 unified tree/quiz evidence contracts and focus
        working-directory: server
        run: |
          python -m json.tool ../grammar/xai7_unified.schema.json > /dev/null
          python -m unittest -v test_xai7_unified

      - name: Validate concise sentence-specific learner explanations
        working-directory: server
        run: |
          python -m json.tool ../grammar/learner_explanation.schema.json > /dev/null
          python -m unittest -v test_learner_explanations
          cd ..
          python scripts/audit_learner_explanations.py > /tmp/learner-explanations-audit.json
          python -m json.tool /tmp/learner-explanations-audit.json > /dev/null

      - name: Validate source-reviewed lesson contracts
        run: |
          python scripts/validate_lessons.py
          python scripts/validate_assessments.py
          python scripts/validate_builder_contracts.py

      - name: Verify native B-R construction catalog and fail-closed audit
        run: |
          python -m json.tool grammar/br_native_constructions.json > /dev/null
          python -m unittest -v server.test_br_native_grammar server.test_br_native_chart

      - name: Run canonical gold-import regression tests
        run: python -m unittest -v server.test_burton_roberts

      - name: Audit all B-R chapter records
        run: python scripts/audit_burton_roberts_import.py --expected-count 252

      - name: Report native B-R rule coverage against 252 reference trees
        run: python scripts/audit_br_native_catalog.py --expected-count 252 --fail-on-penn

      - name: Run all existing B-R chapter validators
        working-directory: web/content/book
        run: |
          set -e
          for validator in validate_ch*.py; do
            echo "=== $validator ==="
            log="/tmp/${validator%.py}.log"
            python "$validator" > "$log"
            cat "$log"
            if grep -Eq '(^PROBLEMS$|^FAIL |FAILED|Traceback)' "$log"; then
              echo "B-R source validator reported a failure: $validator"
              exit 1
            fi
          done

      - name: Run existing model-free parser/matrix and correction regressions
        working-directory: server
        run: |
          python test_licensing.py
          python test_corrector.py
      - name: Validate canonical and Cambridge schema JSON
        run: |
          python -m json.tool docs/canonical-burton-roberts-tree.schema.json > /dev/null
          python -m json.tool grammar/br_tree.schema.json > /dev/null
          python -m json.tool grammar/schema.json > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test dependency
        run: npm ci
      - name: Check browser modules and evidence bridge
        run: |
          node --check web/js/main.js
          node --check web/js/syntax-builder-ui.js
          npm run test:evidence
          npm run test:correction
          npm run test:quiz
          npm run test:lessons
          npm run test:assessments
          npm run test:builder
          node scripts/test_level.js
          node scripts/test_tree_layout.js
          node scripts/test_xai7_focus.mjs
          node scripts/test_learner_explanations.mjs
          node scripts/test_account_integration.js
          node --check web/js/quizzes-ui.js
          node --check web/js/lessons-ui.js
      - name: Build static application including Vercel upload exclusions
        run: |
          npm run build
          python scripts/test_static_build.py
          python scripts/test_runtime_packaging.py
      - name: Verify account integration and UI in Chromium
        env:
          SYNTUTOR_PROGRESSION_TEST_DSN: postgresql://postgres:syntutor-test@localhost:5432/syntutor_progression_test
        run: |
          python -m pip install 'playwright>=1.51,<2'
          python -m playwright install --with-deps chromium
          python scripts/test_progression_browser.py
          python scripts/test_ui_prototype_browser.py
          python scripts/test_account_journey_browser.py
      - name: Save Milestone 10 screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: syntutor-m10-desktop-tablet-mobile
          path: /tmp/syntutor-m10-browser/*.png
