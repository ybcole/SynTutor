<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynTutor — Sign In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 480px;
    }
    .brand-title {
      font-size: 78px;
      font-weight: 900;
      color: #000000;
      letter-spacing: -1.5px;
      margin: 0;
      line-height: 1;
      text-shadow: 4px 6px 14px rgba(0, 0, 0, 0.28);
    }
    .brand-divider { width: 250px; height: 1px; background: #cfcfcf; margin: 16px auto 20px; }
    .subtitle { font-size: 20px; font-weight: 300; color: #222; line-height: 1.4; margin: 0 0 36px; max-width: 420px; }
    .auth-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .input-field {
      width: 100%; height: 44px; padding: 0 14px; border: 1px solid #e2e2e2;
      border-radius: 6px; font-size: 14px; background: #fbfbfb; color: #111; outline: none;
    }
    .input-field:focus { border-color: #000; background: #fff; }
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .btn-primary {
      height: 44px; background: #000; color: #fff; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #222; }
    .btn-secondary {
      height: 38px; background: transparent; color: #666; border: 1px solid #e0e0e0;
      border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-secondary:hover { border-color: #000; color: #000; }
    .msg { font-size: 12.5px; margin-top: 6px; min-height: 18px; line-height: 1.4; }
    .msg.err { color: #d64545; }
    .msg.ok { color: #2e8b57; }
  </style>
</head>
<body>
  <main class="landing-container">
    <h1 class="brand-title">SynTutor</h1>
    <div class="brand-divider"></div>
    <p class="subtitle">Establish grammatical competence through Syntactical structure</p>
    <form id="loginForm" class="auth-form">
      <input type="email" id="email" class="input-field" placeholder="Email address" required autocomplete="email" />
      <input type="password" id="password" class="input-field" placeholder="Password" required autocomplete="current-password" />
      <div class="btn-group">
        <button type="submit" id="signInBtn" class="btn-primary">Sign In</button>
        <button type="button" id="signUpBtn" class="btn-secondary">Register</button>
      </div>
      <div id="authStatus" class="msg"></div>
    </form>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
