<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynTutor — Explainable Phrase-Structure Grammar Tutor</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quiz.css" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('syntutor_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <div id="appSidebarBackdrop" class="app-sidebar-backdrop">
      <aside id="appSidebar" class="app-sidebar" aria-label="Main menu">
        <div class="app-sidebar-top">
          <span id="sidebarBrandBtn" class="sidebar-brand">
            <span class="brand-monogram" aria-hidden="true">S</span>
            <span class="brand-title app-brand-name">SynTutor</span>
          </span>
          <button id="sidebarToggleBtn" class="menu-btn sidebar-toggle" type="button" aria-label="Expand sidebar" title="Expand sidebar" aria-expanded="false" aria-controls="appSidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <line x1="15" y1="4" x2="15" y2="20"></line>
              <polyline points="10 9 7 12 10 15"></polyline>
            </svg>
          </button>
          <button id="closeSidebarBtn" class="drawer-close sidebar-close" type="button" aria-label="Close menu" title="Close menu">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <nav class="app-sidebar-nav">
          <button id="newSessionBtn" class="sidebar-item active" type="button" data-view="tutor" aria-label="Syntax Generator" title="Syntax Generator">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>Syntax Generator</span>
          </button>
          <button id="headerHistoryBtn" class="sidebar-item" type="button" aria-label="Open analysis history" title="History" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>History</span>
          </button>
          <button class="sidebar-item" type="button" data-view="lessons" title="Lessons">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>Lessons</span>
          </button>
          <button class="sidebar-item" type="button" data-view="builder" title="Syntax Builder">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="4" r="2"></circle>
              <circle cx="5" cy="19" r="2"></circle>
              <circle cx="19" cy="19" r="2"></circle>
              <line x1="12" y1="6" x2="12" y2="11"></line>
              <line x1="12" y1="11" x2="5" y2="17"></line>
              <line x1="12" y1="11" x2="19" y2="17"></line>
            </svg>
            <span>Syntax Builder</span>
          </button>
          <button class="sidebar-item" type="button" data-view="leaderboard" title="Leaderboard">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
              <path d="M3 20h18"></path>
            </svg>
            <span>Leaderboard</span>
          </button>
          <button class="sidebar-item" type="button" data-view="achievements" title="Achievements">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="6"></circle>
              <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"></path>
            </svg>
            <span>Achievements</span>
          </button>
        </nav>
        <div id="quizPanel" class="sidebar-quiz" hidden></div>
        <div class="app-sidebar-foot">
          <button id="themeToggleBtn" class="menu-btn" type="button" aria-label="Toggle dark mode" title="Dark / Light mode">
            <svg id="themeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <span class="profile-anchor">
            <button id="identityChip" class="identity-chip" type="button" title="Log in / Sign in" aria-haspopup="menu">
              <span id="identityAvatar" class="identity-avatar guest" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <span id="identityLabel">Guest</span>
            </button>
            <div id="profileMenu" class="profile-menu" role="menu" aria-hidden="true">
              <div id="profileMenuMain" class="profile-menu-view">
                <div id="profileStats" class="profile-stats" role="presentation"></div>
                <button id="profileAddAccount" class="profile-menu-item" type="button" role="menuitem" hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                  </svg>
                  Add Account
                </button>
                <button id="profileSwitchAccount" class="profile-menu-item" type="button" role="menuitem" hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 3L4 7l4 4"></path>
                    <path d="M4 7h16"></path>
                    <path d="M16 21l4-4-4-4"></path>
                    <path d="M20 17H4"></path>
                  </svg>
                  Switch Account
                </button>
                <div id="profileMenuDivider" class="profile-menu-divider" hidden></div>
                <button id="profileLogout" class="profile-menu-item danger" type="button" role="menuitem" hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Log Out
                </button>
                <button id="profileSignIn" class="profile-menu-item" type="button" role="menuitem">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                  </svg>
                  Log In / Sign Up
                </button>
              </div>
              <div id="profileAccounts" class="profile-menu-view" aria-hidden="true" hidden>
                <div id="profileAccountsList" class="profile-accounts-list"></div>
              </div>
            </div>
          </span>
        </div>
      </aside>

      <!-- Left sub-panels: slide out directly beside the rail (History stays
           behind its own ID so every existing listener keeps working). -->
      <div id="historyDrawerBackdrop" class="drawer-backdrop">
        <aside class="history-drawer" aria-label="Analysis history">
          <div class="drawer-header">
            <h2>Analysis History</h2>
            <button id="closeDrawerBtn" class="drawer-close" type="button" aria-label="Close history">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="history-toolbar">
            <div id="historyFilters" class="filter-pills">
              <button class="filter-pill active" type="button" data-filter="all">All</button>
              <button class="filter-pill" type="button" data-filter="error">Errors</button>
              <button class="filter-pill" type="button" data-filter="valid">Valid</button>
            </div>
            <button id="clearHistoryBtn" type="button">Clear all</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </aside>
      </div>
      <!-- Second slide-out sub-panel: Achievements / Leaderboard / quiz-finish
           content (rendered by tree-quiz.js). -->
      <section id="subpanelPlaceholder" class="side-subpanel" aria-label="Side panel"></section>
    </div>
    <main class="app-main">
      <section class="canvas-wrap">
        <div class="canvas-stage">
          <canvas id="treeCanvas" tabindex="0" aria-label="Interactive syntax tree; click a node, or use arrow keys and Enter"></canvas>
          <canvas id="builderCanvas" class="builder-canvas" tabindex="0" aria-label="Syntax builder canvas" hidden></canvas>
          <div id="canvasControls" class="canvas-controls" hidden>
            <button id="builderClear" class="builder-btn" type="button" data-action="clear">Clear</button>
            <button id="builderSnap" class="builder-btn" type="button" data-action="build-tree">Build tree</button>
            <button id="builderModel" class="builder-btn" type="button" data-action="model" hidden>Show model tree</button>
            <button id="builderCheck" class="builder-btn builder-btn-primary" type="button" data-action="check-tree" hidden>Check tree</button>
            <button id="builderNext" class="builder-btn builder-btn-primary" type="button" data-action="next" hidden>Next &rarr;</button>
            <button id="builderDone" class="builder-btn" type="button" data-action="done">Done</button>
          </div>
          <span id="builderHint" class="builder-hint" hidden></span>
          <span id="builderTarget" class="builder-target" hidden></span>
          <div id="canvasOverlay" class="canvas-overlay"></div>
          <div id="emptyTreeState" class="empty-state-canvas">
            <svg class="empty-tree-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="32" cy="16" r="7" />
              <circle cx="16" cy="48" r="7" />
              <circle cx="48" cy="48" r="7" />
              <line x1="27" y1="21" x2="20" y2="42" />
              <line x1="37" y1="21" x2="44" y2="42" />
            </svg>
            <h3 class="empty-tree-title">No Syntax tree to generate yet!</h3>
            <p class="empty-tree-sub">Add your text to see the syntax tree here</p>
          </div>
          <div id="loadingIndicator" class="loading-pill" aria-hidden="true">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Generating syntax tree&hellip;</span>
          </div>
        </div>
      </section>

      <div id="colResizer" class="resizer resizer-col" role="separator" aria-orientation="vertical"
           aria-label="Resize the workspace — drag, or double-click to reset" title="Drag to resize · double-click to reset"></div>

      <div class="pane-side">
        <section class="pane pane-input">
          <button id="mobileNavBtn" class="menu-btn mobile-nav-btn" type="button" aria-label="Open menu" title="Menu" aria-expanded="false" aria-controls="appSidebar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="input-row" id="tutorSurface">
            <div class="input-editor">
              <div id="inputHighlights" aria-hidden="true"></div>
              <textarea id="inputText" class="input-textarea" rows="4" readonly spellcheck="false"
                        placeholder="Click the panel to write a sentence. SynTutor builds its syntax tree and analysis automatically."></textarea>
            </div>
          </div>
          <button id="inputClearBtn" class="input-clear" type="button" aria-label="Clear input" title="Clear text">×</button>
          <div id="quizQuestHost"></div>
        </section>

        <div id="rowResizer" class="resizer resizer-row" role="separator" aria-orientation="horizontal"
             aria-label="Resize the workspace — drag, or double-click to reset" title="Drag to resize · double-click to reset"></div>

        <section class="pane pane-explain">
          <div id="lessonGuideHost" class="guide-host"></div>
          <div id="correctionPanel" class="correction-panel" hidden></div>
          <div id="explainNode" class="node-explainer"></div>
          <div id="emptyExplainState" class="empty-state-explain">
            <svg class="empty-book-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <path d="M12 2v15"></path>
            </svg>
            <p class="empty-explain-title">Ready for Analysis</p>
          </div>
        </section>
      </div>
    </main>

    <div id="lessonsOverlay" class="lessons-overlay">
      <div class="lessons-sheet" role="dialog" aria-label="Lessons">
        <header class="lessons-hero">
          <div class="lessons-hero-text">
            <p class="lessons-hero-kicker">Grammar Course Library</p>
            <h2 class="lessons-hero-title">Choose a module to master</h2>
            <p class="lessons-hero-sub">Pick a phrase or clause construction, then build its syntax trees step by step.</p>
          </div>
          <button id="lessonsCloseBtn" class="lessons-close" type="button" aria-label="Close library" title="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </header>
        <div class="lessons-main">
          <!-- Catalog toolbar: the inline category expander on the left, the
               completion counter on the right. -->
          <div class="sq-catalog-toolbar" id="lessonsToolbar">
            <div class="sq-cat" id="lessonsCategory"></div>
            <p id="lessonsSummary" class="lessons-summary"></p>
          </div>
          <div id="lessonsGrid" class="sq-catalog-grid"></div>
        </div>
      </div>
    </div>

    <div id="authModalBackdrop" class="modal-backdrop">
      <div class="auth-modal" role="dialog" aria-modal="true" aria-label="Log in or sign in">
        <form id="authModalForm" class="auth-modal-form">
          <div class="step-auth">
            <input type="email" id="authEmail" class="modal-input" placeholder="Email address" autocomplete="email" required />
            <div class="password-field">
              <input type="password" id="authPassword" class="modal-input" placeholder="Password" autocomplete="current-password" required />
              <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              </button>
            </div>
            <div id="authPasswordReqs" class="password-reqs" hidden></div>
          </div>
          <div class="code-field" style="display:none">
            <input type="text" id="authCode" class="modal-input" placeholder="6-digit verification code" inputmode="numeric" />
          </div>
          <div class="modal-actions">
            <button type="submit" id="authSignInBtn" class="modal-btn-primary">Sign In</button>
            <button type="button" id="authSignUpBtn" class="modal-btn-secondary">Register</button>
          </div>
          <div id="authModalStatus" class="msg"></div>
        </form>
        <div class="modal-close-row">
          <button id="authContinueGuestBtn" class="modal-ghost-btn" type="button">Continue as guest</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config-hint.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
